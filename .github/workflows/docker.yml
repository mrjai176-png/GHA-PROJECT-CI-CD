name: Docker CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code
        run: |
          cd /home/ubuntu/GHA-PROJECT-CI-CD
          git pull origin master

      - name: Build Docker Image
        run: |
          cd /home/ubuntu/GHA-PROJECT-CI-CD
          docker build -t GHA-PROJECT-CI-CD .

      - name: Run Tests
        run: |
          cd /home/ubuntu/GHA-PROJECT-CI-CD
          docker run --rm GHA-PROJECT-CI-CD npm run test

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Restart App
        run: |
          docker stop backend-prod || true
          docker rm backend-prod || true
          docker run -d --name backend-prod -p 3000:3000GHA-PROJECT-CI-CD
